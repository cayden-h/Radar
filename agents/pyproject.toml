[project]
name = "hawkeye-agents"
version = "0.1.0"
description = "The nine ANS-registered agents behind Hawk Eye."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "httpx>=0.28",
    "cryptography>=44",
]

# hawkeye-backend is a path dependency, not a published one. It carries the
# verification package (`hawkeye_backend.verification`) and the shared models
# that enforce the honesty rule (`hawkeye_backend.models.common.Provenance`).
#
# agents/CLAUDE.md: "Do not write a second verifier. Import that one."
# The same reasoning applies to Provenance, which is enforcement-by-construction
# rather than convention, and would stop being that the moment it was copied.
#
#     pip install -e ../app/backend
#     pip install -e .
#
# The verification package has no FastAPI or hub imports, so when it moves into
# agents/master this becomes an import change and nothing else.

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
hawkeye-agent = "agents.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]
