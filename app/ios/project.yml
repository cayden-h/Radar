name: HawkEye

options:
  bundleIdPrefix: ai.hawkeye
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_MODULE_VERIFIER: NO
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  HawkEye:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HawkEye
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hawkeye.app
        PRODUCT_NAME: Radar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: HawkEye/Info.plist
      properties:
        CFBundleDisplayName: Radar
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        # Required for NWBrowser / Bonjour discovery on iOS 14+.
        # Without BOTH of these, NWBrowser returns nothing and fails silently.
        NSLocalNetworkUsageDescription: >-
          Radar looks for your home hub on this network so it can show you
          who is inside the house. It never leaves your local network to do this.
        NSBonjourServices:
          - _hawkeye._tcp
          - _hawkeye._udp
        UIAppFonts:
          - Oswald-Bold.ttf

  HawkEyeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HawkEyeUITests
    dependencies:
      - target: HawkEye
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hawkeye.app.uitests
        TEST_TARGET_NAME: HawkEye
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HawkEye:
    build:
      targets:
        HawkEye: all
        HawkEyeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HawkEyeUITests
