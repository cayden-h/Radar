name: HawkEye

options:
  bundleIdPrefix: ai.hawkeye
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_MODULE_VERIFIER: NO
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  HawkEye:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HawkEye
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hawkeye.app
        PRODUCT_NAME: Radar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      # The modern single-target watch app: embedded into the phone app's
      # bundle under Watch/, with no WatchKit extension target.
      - target: HawkEyeWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    info:
      path: HawkEye/Info.plist
      properties:
        CFBundleDisplayName: Radar
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        # Required for NWBrowser / Bonjour discovery on iOS 14+.
        # Without BOTH of these, NWBrowser returns nothing and fails silently.
        NSLocalNetworkUsageDescription: >-
          Radar looks for your home hub on this network so it can show you
          who is inside the house. It never leaves your local network to do this.
        NSBonjourServices:
          - _hawkeye._tcp
          - _hawkeye._udp
        UIAppFonts:
          - Oswald-Bold.ttf

  # The watch app. Shares Models, Shared and DesignSystem with the phone by
  # source path rather than by a copied file, so there is one definition of
  # every wire type and the two apps cannot drift apart.
  #
  # The bundle IDs must nest exactly and WKCompanionAppBundleIdentifier must
  # name the phone app. Getting either wrong produces a build that succeeds and
  # a watch app that never pairs.
  HawkEyeWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: HawkEyeWatch
        excludes:
          - "**/.DS_Store"
      - path: HawkEye/Models
      - path: HawkEye/Shared
      - path: HawkEye/DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hawkeye.app.watchkitapp
        PRODUCT_NAME: Hawk Eye
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        SKIP_INSTALL: NO
    info:
      path: HawkEyeWatch/Info.plist
      properties:
        CFBundleDisplayName: Hawk Eye
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: ai.hawkeye.app
        WKRunsIndependentlyOfCompanionApp: false
        UIUserInterfaceStyle: Dark

  # Unit tests for the platform-neutral half: the wire codec and the router.
  # An iOS target rather than a watchOS one, deliberately, so the rules can be
  # tested on the runtime that is always installed.
  HawkEyeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HawkEyeTests
    dependencies:
      - target: HawkEye
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hawkeye.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Radar.app/Radar"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

  HawkEyeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HawkEyeUITests
    dependencies:
      - target: HawkEye
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hawkeye.app.uitests
        TEST_TARGET_NAME: HawkEye
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HawkEye:
    build:
      targets:
        HawkEye: all
        HawkEyeTests: [test]
        HawkEyeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HawkEyeTests
        - HawkEyeUITests

  HawkEyeWatch:
    build:
      targets:
        HawkEyeWatch: all
    run:
      config: Debug
