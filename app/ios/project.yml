name: HawkEye

options:
  bundleIdPrefix: ai.hawkeye
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_MODULE_VERIFIER: NO
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  HawkEye:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HawkEye
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hawkeye.app
        PRODUCT_NAME: Hawk Eye
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: HawkEye/Info.plist
      properties:
        CFBundleDisplayName: Hawk Eye
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        # This target uses an explicit Info.plist (via `info.path` above), so
        # `INFOPLIST_KEY_*` build settings are never merged in — those only
        # apply when Xcode generates the whole plist itself
        # (GENERATE_INFOPLIST_FILE: YES), which this target does not set.
        # An `INFOPLIST_KEY_UILaunchScreen_Generation: YES` build setting
        # sat here silently doing nothing, which meant the compiled app had
        # no UILaunchScreen key at all — and an app with no launch-screen
        # declaration gets rendered by iOS in a fixed-size legacy
        # compatibility box centered on the real screen, not the actual
        # device bounds. `{}` is the documented way to opt into a plain,
        # full-size, system-generated launch screen.
        UILaunchScreen: {}
        # Required for NWBrowser / Bonjour discovery on iOS 14+.
        # Without BOTH of these, NWBrowser returns nothing and fails silently.
        NSLocalNetworkUsageDescription: >-
          Hawk Eye looks for your home hub on this network so it can show you
          who is inside the house. It never leaves your local network to do this.
        NSBonjourServices:
          - _hawkeye._tcp
          - _hawkeye._udp

  HawkEyeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HawkEyeUITests
    dependencies:
      - target: HawkEye
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hawkeye.app.uitests
        TEST_TARGET_NAME: HawkEye
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HawkEye:
    build:
      targets:
        HawkEye: all
        HawkEyeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HawkEyeUITests
