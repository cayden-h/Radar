[project]
name = "hawkeye-backend"
version = "0.1.0"
description = "Hawk Eye app-facing edge. The iOS app talks to this; this talks to agents/master."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "websockets>=13.0",
    "cryptography>=44",
    "twilio>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pyjwt>=2.9"]
# The replay archive: sealed records to MongoDB. Optional because the hub
# imports and runs without it when HAWKEYE_REPLAY_ARCHIVE=off, which is why
# MongoReplayArchive imports motor inside __init__ rather than at module scope.
#
#     pip install -e ".[archive]"
archive = ["motor>=3.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hawkeye_backend"]
